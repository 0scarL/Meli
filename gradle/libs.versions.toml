[versions]
activityKtx = "1.8.2"
agp = "7.4.2"
fragmentKtx = "1.6.2"
glide = "4.16.0"
kotlin = "1.9.0"
coreKtx = "1.12.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.6.1"
kotlinxCoroutinesAndroid = "1.7.3"
material = "1.12.0"
activity = "1.9.0"
constraintlayout = "2.1.4"
hilt = "2.49"
retrofit = "2.9.0"
roomKtx = "2.6.1"
viewmodel = "2.6.2"
mockk="1.12.2"
arch="2.1.0"

[libraries]
androidx-activity-ktx = { group = "androidx.activity",name="activity-ktx", version.ref = "activityKtx" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-fragment-ktx = { group = "androidx.fragment",name="fragment-ktx", version.ref = "fragmentKtx" }
compiler = { group = "com.github.bumptech.glide", name ="compiler", version.ref = "glide" }
glide = { group = "com.github.bumptech.glide",name = "glide", version.ref = "glide" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
#hilt-dagger
hilt-android ={group="com.google.dagger",name="hilt-android",version.ref="hilt"}
hilt-compiler = { group= "com.google.dagger",name="hilt-compiler", version.ref = "hilt" }
#viewmodel
android-view-model = {group = "androidx.lifecycle", name="lifecycle-viewmodel-ktx",version.ref="viewmodel"}
android-live-data = {group = "androidx.lifecycle", name="lifecycle-livedata-ktx",version.ref="viewmodel"}
#retrofit
retrofit = { group = "com.squareup.retrofit2", name="retrofit", version.ref = "retrofit" }
converter-gson = { group = "com.squareup.retrofit2",name="converter-gson", version.ref = "retrofit" }
#corrutinas
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx",name="kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx",name="kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesAndroid" }
#room
androidx-room-compiler = { group = "androidx.room",name="room-compiler", version.ref = "roomKtx" }
androidx-room-ktx = { group = "androidx.room",name="room-ktx", version.ref = "roomKtx" }
androidx-room-runtime = { group = "androidx.room",name="room-runtime", version.ref = "roomKtx" }
#Mockk
android-mockk= {group="io.mockk",name="mockk",version.ref="mockk"}
#arch
arch-test = {group="androidx.arch.core", name="core-testing", version.ref="arch"}

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
hilt-android = {id="com.google.dagger.hilt.android", version.ref = "hilt" }

